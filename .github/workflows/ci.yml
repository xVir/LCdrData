name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    name: Bazel unit tests
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Bazel version
        run: bazel --version

      - name: Run unit tests
        run: bazel test //LCdrDataTests/... --test_output=errors
